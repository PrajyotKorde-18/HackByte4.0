<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body { font-family: 'Inter', sans-serif; width: 300px; padding: 1rem; background: #0f172a; color: white; margin: 0; }
    h3 { margin-bottom: 1rem; color: #8b5cf6; }
    .status { font-size: 12px; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .btn { background: #8b5cf6; color: white; border: none; width: 100%; padding: 0.75rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; }
    .footer { margin-top: 1rem; font-size: 10px; color: #94a3b8; text-align: center; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; background: #1e293b; border: 1px solid #334155; }
    .active { border-color: #8b5cf6; color: #8b5cf6; }
  </style>
</head>
<body>
  <h3>PromptBridge</h3>
  <div class="status">
    <div class="badge active">Middleware v1</div>
    <div class="badge">Running locally</div>
  </div>
  <p style="font-size: 0.8rem; opacity: 0.8; margin-bottom: 2rem;">
    Real-time AI input/output optimization active for ChatGPT, Claude, and Gemini.
  </p>
  <button class="btn">Configure Pipelines</button>
  <div class="footer">© 2026 PromptBridge Middleware Engine</div>
</body>
</html>
